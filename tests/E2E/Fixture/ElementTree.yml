# E2E fixture for Playwright: Section > Row > Column > leaf hierarchy.
#
# Uses Page (not TestPage) because TestOnly classes are not available
# at runtime — only during PHPUnit execution.
#
# Top-down ordering: parents written before children so =>ClassName.id
# references resolve. Auto-scaffolding is suppressed by FixtureLoader.
#
# All pages use the 'e2e-' URLSegment prefix for cleanup identification.
#
# Elements parent directly to their container via polymorphic has_one (Parent).
# No intermediary area model.

Page:
  e2e_page:
    Title: 'E2E Grid Test Page'
    URLSegment: 'e2e-grid-test'

# --- Section (into page) ---
WeDevelop\Grid\Elements\Section:
  section1:
    Title: 'Main Section'
    ShowTitle: 1
    Sort: 1
    Parent: =>Page.e2e_page

# --- Row (into section) ---
WeDevelop\Grid\Elements\Row:
  row1:
    Title: 'First Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Section.section1

# --- Columns (into row) ---
WeDevelop\Grid\Elements\Column:
  col1:
    Title: 'Left Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Row.row1
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":8,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'
  col2:
    Title: 'Right Column'
    Sort: 2
    Parent: =>WeDevelop\Grid\Elements\Row.row1
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":false},"sm":{"width":12,"offset":0,"visible":false},"md":{"width":4,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'

# --- Leaves (into columns) ---
WeDevelop\Grid\Model\GridElement:
  leaf1:
    Title: 'Text Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Column.col1
  leaf2:
    Title: 'Image Block'
    Sort: 2
    Parent: =>WeDevelop\Grid\Elements\Column.col1
  leaf3:
    Title: 'Video Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Column.col2
