    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.row_b1_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.col_b1a_area
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":12,"offset":0,"visible":true},"lg":{"width":12,"offset":0,"visible":true},"xl":{"width":12,"offset":0,"visible":true},"xxl":{"width":12,"offset":0,"visible":true}}'
  col_b2a:
    Title: 'Column B2-A'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.row_b2_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.col_b2a_area
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":12,"offset":0,"visible":true},"lg":{"width":12,"offset":0,"visible":true},"xl":{"width":12,"offset":0,"visible":true},"xxl":{"width":12,"offset":0,"visible":true}}'

