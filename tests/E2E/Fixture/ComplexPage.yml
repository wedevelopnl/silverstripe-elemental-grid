# E2E fixture: page with two sections for testing versioned states.
#
# Section 1 (Main Section): published section with modified row and leaf states:
#   section1       — stays published (on both Draft and Live)
#   row1           — title changed after publishRecursive (modified)
#   draft_leaf     — unpublished after page publishRecursive (draft-only)
#   published_leaf — stays published (on both Draft and Live)
#   modified_leaf  — published, then draft title changed (differs between stages)
#
# Section 2 (Draft Section): unpublished after publishRecursive.
#   Unpublishing a section cascades via $owns to all descendants,
#   so section2, row2, col3, and section2_leaf all become draft-only.
#
# Post-actions are configured in dev.yml.
#
# Bottom-up ordering: children written before parents to prevent
# auto-scaffolding of Row/Column elements.

DNADesign\Elemental\Models\ElementalArea:
  page_area: {}
  section_area: {}
  row_area: {}
  col1_area: {}
  col2_area: {}
  section2_area: {}
  row2_area: {}
  col3_area: {}

Page:
  e2e_page:
    Title: 'E2E Complex Page'
    URLSegment: 'e2e-complex-page'
    ElementalArea: =>DNADesign\Elemental\Models\ElementalArea.page_area

# --- Leaves first (into column areas) ---
DNADesign\Elemental\Models\BaseElement:
  draft_leaf:
    Title: 'Draft Only Block'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.col1_area
  published_leaf:
    Title: 'Published Block'
    Sort: 2
    Parent: =>DNADesign\Elemental\Models\ElementalArea.col1_area
  modified_leaf:
    Title: 'Modified Text Block'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.col2_area
  section2_leaf:
    Title: 'Section Two Block'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.col3_area

# --- Columns (into row area) ---
WeDevelop\Grid\Elements\ElementColumn:
  col1:
    Title: 'Left Column'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.row_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.col1_area
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":8,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'
  col2:
    Title: 'Right Column'
    Sort: 2
    Parent: =>DNADesign\Elemental\Models\ElementalArea.row_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.col2_area
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":false},"sm":{"width":12,"offset":0,"visible":false},"md":{"width":4,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'
  col3:
    Title: 'Draft Section Column'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.row2_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.col3_area
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":12,"offset":0,"visible":true},"lg":{"width":12,"offset":0,"visible":true},"xl":{"width":12,"offset":0,"visible":true},"xxl":{"width":12,"offset":0,"visible":true}}'

# --- Row (into section area) ---
WeDevelop\Grid\Elements\ElementRow:
  row1:
    Title: 'First Row'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.section_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.row_area
  row2:
    Title: 'Second Row'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.section2_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.row2_area

# --- Section (into page area) ---
WeDevelop\Grid\Elements\ElementSection:
  section1:
    Title: 'Main Section'
    Sort: 1
    Parent: =>DNADesign\Elemental\Models\ElementalArea.page_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.section_area
  section2:
    Title: 'Draft Section'
    Sort: 2
    Parent: =>DNADesign\Elemental\Models\ElementalArea.page_area
    ChildArea: =>DNADesign\Elemental\Models\ElementalArea.section2_area
