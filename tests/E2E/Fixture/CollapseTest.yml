# E2E fixture for collapse testing: multiple siblings at every level.
#
# Structure:
#   Page 1 (E2E Collapse Test Page):
#     Section A
#       Row A1 (2 columns: Col A1-L, Col A1-R)
#       Row A2 (1 column: Col A2)
#     Section B
#       Row B1 (1 column: Col B1)
#
#   Page 2 (E2E Other Page): minimal page for CMS navigation testing.
#
# Provides sibling coverage: 2 sections, 2 rows in section A, 2 columns in row A1.
#
# Top-down ordering: parents before children. Auto-scaffolding suppressed by FixtureLoader.
# All pages use 'e2e-' URLSegment prefix for cleanup identification.
#
# Elements parent directly to their container via polymorphic has_one (Parent).

Page:
  e2e_page:
    Title: 'E2E Collapse Test Page'
    URLSegment: 'e2e-collapse-test'
  e2e_other_page:
    Title: 'E2E Other Page'
    URLSegment: 'e2e-other-page'

# --- Sections ---
WeDevelop\Grid\Model\Section:
  section_a:
    Title: 'Section A'
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page
  section_b:
    Title: 'Section B'
    Sort: 2
    Zone: main
    Parent: =>Page.e2e_page

# --- Rows ---
WeDevelop\Grid\Model\Row:
  row_a1:
    Title: 'Row A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_a
  row_a2:
    Title: 'Row A2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section_a
  row_b1:
    Title: 'Row B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_b

# --- Columns ---
WeDevelop\Grid\Model\Column:
  col_a1l:
    Title: 'Column A1-Left'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a1
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":6,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'
  col_a1r:
    Title: 'Column A1-Right'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.row_a1
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":6,"offset":0,"visible":true},"lg":{"width":6,"offset":0,"visible":true},"xl":{"width":6,"offset":0,"visible":true},"xxl":{"width":6,"offset":0,"visible":true}}'
  col_a2:
    Title: 'Column A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a2
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":12,"offset":0,"visible":true},"lg":{"width":12,"offset":0,"visible":true},"xl":{"width":12,"offset":0,"visible":true},"xxl":{"width":12,"offset":0,"visible":true}}'
  col_b1:
    Title: 'Column B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b1
    GridSettings: '{"xs":{"width":12,"offset":0,"visible":true},"sm":{"width":12,"offset":0,"visible":true},"md":{"width":12,"offset":0,"visible":true},"lg":{"width":12,"offset":0,"visible":true},"xl":{"width":12,"offset":0,"visible":true},"xxl":{"width":12,"offset":0,"visible":true}}'

# --- Leaves ---
WeDevelop\Grid\Model\ContentElement:
  leaf_a1l:
    Title: 'Block A1-Left'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1l
  leaf_a1r:
    Title: 'Block A1-Right'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1r
  leaf_a2:
    Title: 'Block A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a2
  leaf_b1:
    Title: 'Block B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b1
