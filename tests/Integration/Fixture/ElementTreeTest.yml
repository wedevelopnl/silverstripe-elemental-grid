# Bottom-up ordering: children are written before parent containers so that
# onAfterWrite scaffolding checks see existing children and skip
# auto-creation of Row/Column elements.
#
# Elements parent directly to their container via polymorphic has_one (Parent).

WeDevelop\Grid\Tests\Integration\Fixture\TestPage:
  testpage:
    Title: 'Tree Test Page'

# --- Leaves first (into columns) ---
WeDevelop\Grid\Model\GridElement:
  leaf1:
    Title: 'Text Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Column.col1
  leaf2:
    Title: 'Image Block'
    Sort: 2
    Parent: =>WeDevelop\Grid\Elements\Column.col1
  leaf3:
    Title: 'Video Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Column.col2

# --- Columns (into row; children already have leaves) ---
WeDevelop\Grid\Elements\Column:
  col1:
    Title: 'Left Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Row.row1
  col2:
    Title: 'Right Column'
    Sort: 2
    Parent: =>WeDevelop\Grid\Elements\Row.row1
  col3:
    Title: 'Full Width Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Row.row2

# --- Rows (into sections; children already have columns) ---
# row3 has no children — prevents auto-scaffolding of a Column
WeDevelop\Grid\Elements\Row:
  row1:
    Title: 'First Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Elements\Section.section1
  row2:
    Title: 'Second Row'
    Sort: 2
    Parent: =>WeDevelop\Grid\Elements\Section.section1
  row3:
    Title: 'Empty Row'
    Sort: 3
    Parent: =>WeDevelop\Grid\Elements\Section.section1

# --- Sections (into page; children already have rows) ---
# section2 has no children — prevents auto-scaffolding of a Row
WeDevelop\Grid\Elements\Section:
  section1:
    Title: 'First Section'
    Sort: 1
    Parent: =>WeDevelop\Grid\Tests\Integration\Fixture\TestPage.testpage
  section2:
    Title: 'Second Section'
    Sort: 2
    Parent: =>WeDevelop\Grid\Tests\Integration\Fixture\TestPage.testpage
