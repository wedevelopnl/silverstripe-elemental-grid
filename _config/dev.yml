---
Name: elemental-grid-dev
Only:
  environment: dev
---

# Playwright's setup project and chromium project use different user agents
# (real browser vs devices['Desktop Chrome']), which triggers session invalidation.
SilverStripe\Control\Session:
  strict_user_agent_check: false

SilverStripe\Dev\DevelopmentAdmin:
  controllers:
    elemental-grid-fixtures:
      class: 'WeDevelop\ElementalGrid\Dev\FixtureController'
      description: 'Load and reset E2E fixtures for elemental grid'

WeDevelop\ElementalGrid\Dev\FixtureLoader:
  fixtures:
    element-tree:
      path: 'wedevelopnl/silverstripe-elemental-grid:tests/E2E/Fixture/ElementTree.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    empty-page: 'wedevelopnl/silverstripe-elemental-grid:tests/E2E/Fixture/EmptyPage.yml'
    collapse-test: 'wedevelopnl/silverstripe-elemental-grid:tests/E2E/Fixture/CollapseTest.yml'
    drag-and-drop:
      path: 'wedevelopnl/silverstripe-elemental-grid:tests/E2E/Fixture/DragAndDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    complex-page:
      path: 'wedevelopnl/silverstripe-elemental-grid:tests/E2E/Fixture/ComplexPage.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
        - action: unpublish
          class: 'DNADesign\Elemental\Models\BaseElement'
          identifier: draft_leaf
        - action: modify
          class: 'DNADesign\Elemental\Models\BaseElement'
          identifier: modified_leaf
          fields:
            Title: 'Modified Text Block (draft)'
        - action: modify
          class: 'WeDevelop\ElementalGrid\Elements\ElementRow'
          identifier: row1
          fields:
            Title: 'First Row (modified)'
        - action: unpublish
          class: 'WeDevelop\ElementalGrid\Elements\ElementSection'
          identifier: section2
