---
Name: elemental-grid-elements
---

# Apply ElementalAreasExtension so each container's ChildArea
# is auto-created and managed (CMS fields, relation discovery)
WeDevelop\ElementalGrid\Elements\ElementSection:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  allowed_elements:
    - WeDevelop\ElementalGrid\Elements\ElementRow

WeDevelop\ElementalGrid\Elements\ElementRow:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  can_be_root: false
  allowed_elements:
    - WeDevelop\ElementalGrid\Elements\ElementColumn

WeDevelop\ElementalGrid\Elements\ElementColumn:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  can_be_root: false
  disallowed_elements:
    - WeDevelop\ElementalGrid\Elements\ElementSection
    - WeDevelop\ElementalGrid\Elements\ElementRow
    - WeDevelop\ElementalGrid\Elements\ElementColumn

---
Name: elemental-grid-validation
After:
  - '#elemental-grid-elements'
---

DNADesign\Elemental\Models\BaseElement:
  extensions:
    HierarchyValidation: WeDevelop\ElementalGrid\Validation\HierarchyValidationExtension

---
Name: elemental-grid-services
After:
  - '#elemental-grid-validation'
---

SilverStripe\Core\Injector\Injector:
  WeDevelop\ElementalGrid\Validation\HierarchyValidatorInterface:
    class: WeDevelop\ElementalGrid\Validation\HierarchyValidationService
  WeDevelop\ElementalGrid\Repository\ElementRepositoryInterface:
    class: WeDevelop\ElementalGrid\Repository\OrmElementRepository
  WeDevelop\ElementalGrid\Repository\ElementalAreaRepositoryInterface:
    class: WeDevelop\ElementalGrid\Repository\OrmElementalAreaRepository
  WeDevelop\ElementalGrid\Service\ElementTreeBuilder:
    constructor:
      elementRepository: '%$WeDevelop\ElementalGrid\Repository\ElementRepositoryInterface'
  WeDevelop\ElementalGrid\Service\ElementPersistenceService: ~
  WeDevelop\ElementalGrid\Contract\ReorderValidatorInterface:
    class: WeDevelop\ElementalGrid\Validation\ReorderValidator
  WeDevelop\ElementalGrid\Contract\ReorderExecutorInterface:
    class: WeDevelop\ElementalGrid\Service\ReorderExecutor
    constructor:
      elementRepository: '%$WeDevelop\ElementalGrid\Repository\ElementRepositoryInterface'
  WeDevelop\ElementalGrid\Service\ReorderService:
    constructor:
      validator: '%$WeDevelop\ElementalGrid\Contract\ReorderValidatorInterface'
      executor: '%$WeDevelop\ElementalGrid\Contract\ReorderExecutorInterface'
