---
Name: elemental-grid-elements
---

# Apply ElementalAreasExtension so each container's ChildArea
# is auto-created and managed (CMS fields, relation discovery)
WeDevelop\Grid\Elements\Section:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  allowed_elements:
    - WeDevelop\Grid\Elements\Row
  controller_template: ElementSectionHolder

WeDevelop\Grid\Elements\Row:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  can_be_root: false
  allowed_elements:
    - WeDevelop\Grid\Elements\Column
  controller_template: ElementRowHolder

WeDevelop\Grid\Elements\Column:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalAreasExtension
  can_be_root: false
  disallowed_elements:
    - WeDevelop\Grid\Elements\Section
    - WeDevelop\Grid\Elements\Row
    - WeDevelop\Grid\Elements\Column
  controller_template: ElementColumnHolder

---
Name: elemental-grid-validation
After:
  - '#elemental-grid-elements'
---

DNADesign\Elemental\Models\BaseElement:
  extensions:
    HierarchyValidation: WeDevelop\Grid\Validation\HierarchyValidationExtension

---
Name: elemental-grid-services
After:
  - '#elemental-grid-validation'
---

SilverStripe\Core\Injector\Injector:
  WeDevelop\Grid\Validation\HierarchyValidatorInterface:
    class: WeDevelop\Grid\Validation\HierarchyValidationService
  WeDevelop\Grid\Repository\ElementRepositoryInterface:
    class: WeDevelop\Grid\Repository\OrmElementRepository
  WeDevelop\Grid\Repository\ElementalAreaRepositoryInterface:
    class: WeDevelop\Grid\Repository\OrmElementalAreaRepository
  WeDevelop\Grid\Service\GridTreeBuilder:
    constructor:
      elementRepository: '%$WeDevelop\Grid\Repository\ElementRepositoryInterface'
      logger: '%$Psr\Log\LoggerInterface'
  WeDevelop\Grid\Service\ElementPersistenceService: ~
  WeDevelop\Grid\Contract\ReorderValidatorInterface:
    class: WeDevelop\Grid\Validation\ReorderValidator
  WeDevelop\Grid\Contract\ReorderExecutorInterface:
    class: WeDevelop\Grid\Service\ReorderExecutor
    constructor:
      elementRepository: '%$WeDevelop\Grid\Repository\ElementRepositoryInterface'
  WeDevelop\Grid\Service\ReorderService:
    constructor:
      validator: '%$WeDevelop\Grid\Contract\ReorderValidatorInterface'
      executor: '%$WeDevelop\Grid\Contract\ReorderExecutorInterface'
      persistenceService: '%$WeDevelop\Grid\Service\ElementPersistenceService'
