---
Name: elemental-grid-cms
After:
  - '#elemental-grid-elements'
  - '#elemental'
---

# Replace stock ElementalAreaField via Injector so our lightweight
# GridEditorField is used instead of the GridField-based original.
SilverStripe\Core\Injector\Injector:
  DNADesign\Elemental\Forms\ElementalAreaField:
    class: WeDevelop\ElementalGrid\Forms\GridEditorField

# Block stock elemental bundles and load our own
SilverStripe\Admin\LeftAndMain:
  extensions:
    ElementalGrid: WeDevelop\ElementalGrid\Extensions\ElementalGridLeftAndMainExtension
  extra_requirements_javascript:
    - 'wedevelopnl/silverstripe-elemental-grid:client/dist/js/bundle.js'
  extra_requirements_css:
    - 'wedevelopnl/silverstripe-elemental-grid:client/dist/styles/bundle.css'
